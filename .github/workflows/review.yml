# Reviews this repository's pull requests with RevEngine through org-review.yml, the shared
# workflow, which says what it needs and does. Other repositories call it with this same file.
name: Review
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  review:
    uses: nissa-seru/rev-engine/.github/workflows/org-review.yml@main
    with:
      # This repository's own pull requests are the house's, reviewed on request.
      at-open: false
      pr-number: ${{ inputs.pr-number }}
    secrets:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
