# Reviews a pull request in this repository with RevEngine itself, through a model endpoint
# on a private tailnet. A person with write access comments /review on a pull request, or
# runs this workflow with a pull request number.
#
# Once that person's write access is checked, the runner joins the tailnet for the length of
# the job, as an ephemeral device tagged tag:ci, through Tailscale's workload identity
# federation, so no Tailscale secret is stored here. The tailnet's policy is meant to let that
# tag reach only the endpoint's port on its host; this file can't check that it does.
# Repository variables TS_CLIENT_ID and TS_AUDIENCE name the federated identity, MODEL_HOST is
# the endpoint's tailnet address, which the join waits to reach, and MODEL_BASE_URL is the
# endpoint's base URL for Anthropic Messages, to which the client adds /v1/messages. Secret
# MODEL_API_KEY is the endpoint's key.
name: Review
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/review ') || github.event.comment.body == '/review'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The action checks this too, but only after the join, so it is checked here first.
      - name: Check who asked
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$permission" in
            admin|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::notice::No review: $ACTOR does not have write access to $REPO" ;;
          esac

      - name: Join the tailnet
        if: steps.who.outputs.allowed == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.MODEL_HOST }}

      - name: Review
        if: steps.who.outputs.allowed == 'true'
        uses: nissa-seru/rev-engine@main
        with:
          model-base-url: ${{ vars.MODEL_BASE_URL }}
          model-api: anthropic
          model-api-key: ${{ secrets.MODEL_API_KEY }}
          model: claude-opus-5-5
          pr-number: ${{ inputs.pr-number }}

      # A review that stops partway otherwise shows only in the Actions tab.
      - name: Say that the review stopped
        if: (failure() || cancelled()) && steps.who.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.pr-number || github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$NUMBER" --repo "$REPO" --body "The review run stopped before it finished, so its review may be missing or incomplete. The run's log says why: $RUN"
