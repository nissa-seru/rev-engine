# One review workflow for many repositories, each of which calls it from a short workflow of its
# own, such as this repository's review.yml. It reviews every pull request when it's opened,
# reopened or marked ready, whoever its author, unless the caller turns at-open off, and again
# whenever a person with write access comments /review.
#
# The runner joins a private tailnet for the length of the job, as an ephemeral device tagged
# tag:ci, through Tailscale's workload identity federation, and reviews through a model
# endpoint there. The tailnet's credential is meant to accept only jobs that run this file,
# and its policy to let tag:ci reach only the endpoint's port. Neither can be checked here.
#
# Pull requests from forks are reviewed through pull_request_target, which runs this
# workflow as the base branch has it, with the repository's secrets. Their code is checked
# out as data and only read: nothing from the pull request is built or run with those secrets,
# or outside a container. The dependencies job's install runs in a container that sees only
# the checkout, where an npm configuration the pull request carries can still run a program of
# its choosing; that job has no secrets and no tailnet, and its token can only read.
#
# The caller's repository or organization provides variables TS_CLIENT_ID and TS_AUDIENCE
# (the federated identity), MODEL_HOST (the endpoint's tailnet address, which the join waits
# to reach) and MODEL_BASE_URL (the endpoint's base URL for Anthropic Messages), and the
# secret MODEL_API_KEY.
#
# With the variable REVIEW_PIPELINE set to "shape", the review is the review shape (src/shape),
# which also needs SOL_BASE_URL (the endpoint's base URL for OpenAI Responses), seals the run it
# saves with MODEL_API_KEY (since anyone signed in to GitHub can download a public repository's
# artifacts, and the run holds what the review doesn't post), reads the repository's
# open issues when the caller's permissions grant issues: read, may take up to
# the job's six hours, and reads the head's dependencies, installed by a job of their own.
# REVIEW_CONSUMERS optionally names public repositories that rely on this one, as owner/name
# separated by spaces. Without REVIEW_PIPELINE, it is RevEngine's own reviewer, as before.
name: RevEngine review
on:
  workflow_call:
    inputs:
      at-open:
        description: Whether to review every pull request when it's opened, reopened or marked ready. With false, pull requests are reviewed only when someone with write access comments /review.
        type: boolean
        default: true
      pr-number:
        description: Pull request to review, for a manual run.
        type: string
        default: ""
    secrets:
      MODEL_API_KEY:
        required: true
jobs:
  who:
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
       contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action) &&
       inputs.at-open) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (startsWith(github.event.comment.body, '/review ') || github.event.comment.body == '/review')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.who.outputs.allowed }}
      head: ${{ steps.head.outputs.head }}
    steps:
      # A comment or a manual run asks as a person, who needs write access; the action checks this
      # too, but only after the join, so it's checked here first. A pull request event asks as
      # this workflow, whose at-open input decides.
      - name: Check who asked
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request_target ]; then echo "allowed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A failed lookup fails the run, rather than passing for "no write access".
          permission=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)
          case "$permission" in
            admin|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::notice::No review: $ACTOR does not have write access to $REPO" ;;
          esac

      # The head the dependencies are installed from, for the review shape.
      - name: Find the head
        id: head
        if: steps.who.outputs.allowed == 'true' && vars.REVIEW_PIPELINE == 'shape'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.pr-number || github.event.pull_request.number || github.event.issue.number }}
        # A failed lookup fails the run, rather than installing from an empty ref.
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha)
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pull request $NUMBER has no head commit in its answer"; exit 1; }
          echo "head=$head" >> "$GITHUB_OUTPUT"

  # The review shape's readers read dependencies' source, installed here with scripts off: from the head's bun or npm
  # lockfile, or, when its root has a package.json and no lockfile at all, from package.json's ranges. A fork's package
  # manager reads the fork's own configuration, so the install runs in a job of its own, with no secrets, no tailnet,
  # and a token that can only read, kept out of the checkout. A failed install, a yarn or pnpm lockfile with neither
  # of those, or no package.json leaves the review to read without dependencies.
  dependencies:
    needs: who
    if: needs.who.outputs.allowed == 'true' && vars.REVIEW_PIPELINE == 'shape'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    # Whether there is an artifact to place, so a review whose dependencies job passed nothing on doesn't try to.
    outputs:
      passed: ${{ steps.pass.outcome == 'success' }}
    steps:
      # checkout refuses a fork's code under pull_request_target unless told it may, since the danger is
      # running that code with the repository's secrets. This job has none, and runs no script of it on the runner:
      # the install below runs in a container that sees only the checkout.
      - name: Check out the head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.who.outputs.head }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      # Scripts off doesn't keep a fork's package configuration from running code: its .npmrc can name the git
      # program npm runs for a git dependency. So the install runs in a container that sees only the checkout, not
      # the runner's actions, tools or processes, whose runtime token would let code poison the repository's caches.
      - name: Install the dependencies, scripts off, in a container
        id: install
        run: |
          set -euo pipefail
          ranges=""
          # Each lockfile by its own installer. A yarn or pnpm lockfile, with neither bun's nor npm's beside it, isn't
          # installed from, since npm would ignore its pins: only a root with no lockfile at all takes package.json's ranges.
          # What the head itself has at node_modules goes first, so only what this install puts there is passed on.
          rm -rf node_modules
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            image=oven/bun:1; install=(bun install --frozen-lockfile --ignore-scripts)
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            image=node:24; install=(npm ci --ignore-scripts --no-audit --no-fund)
          elif [ -f yarn.lock ] || [ -f pnpm-lock.yaml ]; then
            echo "::notice::The head's only lockfile is yarn's or pnpm's, which this job doesn't install from, so the review reads without dependencies"
            exit 0
          elif [ -f package.json ]; then
            # No lockfile: the versions come from package.json's ranges, which may not be the ones the author ran, so
            # a marker tells the review to say so. No lockfile is written.
            image=node:24; install=(npm install --ignore-scripts --no-audit --no-fund --no-package-lock); ranges=true
          else
            echo "::notice::No package.json at the root, so the review reads without dependencies"
            exit 0
          fi
          docker run --rm -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" -e HOME=/tmp "$image" "${install[@]}"
          # A package.json that names no dependencies can leave no node_modules at all.
          if [ ! -d node_modules ]; then echo "::notice::The install left no node_modules, so there are no dependencies to pass on"; exit 0; fi
          # A lockfile can make node_modules/<x> a link to a path of its choosing, even with scripts off, and the
          # upload follows links: one into /proc/self would carry the uploading step's own environment, its runtime
          # token among it, into the artifact. So no link leaves this job; the readers skip links anyway.
          find node_modules -type l -delete
          if [ -n "$(find node_modules -type l -print -quit)" ]; then echo "::error::links remain in node_modules"; exit 1; fi
          # An upload of no files makes no artifact, and the review would name one that isn't there.
          if [ -z "$(find node_modules -type f -print -quit)" ]; then echo "::notice::The install left no files in node_modules, so there are no dependencies to pass on"; exit 0; fi
          if [ -n "$ranges" ]; then touch node_modules/.installed-from-ranges; fi
          echo "installed=true" >> "$GITHUB_OUTPUT"
      - name: Pass them on
        id: pass
        if: steps.install.outputs.installed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rev-engine-dependencies
          path: node_modules
          include-hidden-files: true
          retention-days: 1
          # A re-run of the workflow uploads again under the same name, which upload-artifact refuses unless told.
          overwrite: true

  review:
    needs: [who, dependencies]
    if: ${{ !cancelled() && needs.who.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ vars.REVIEW_PIPELINE == 'shape' && 360 || 30 }}
    # Runs for one pull request queue rather than overlap. The comment gate above keeps a stranger's
    # /review out of the queue, where it would replace a pending review.
    concurrency:
      group: rev-engine-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number }}
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.MODEL_HOST }}

      - name: Review
        uses: nissa-seru/rev-engine@main
        with:
          model-base-url: ${{ vars.MODEL_BASE_URL }}
          model-api: anthropic
          model-api-key: ${{ secrets.MODEL_API_KEY }}
          model: claude-opus-5-5
          pr-number: ${{ inputs.pr-number }}
          allow-forks: "true"
          authors: any
          pipeline: ${{ vars.REVIEW_PIPELINE || 'reader' }}
          sol-base-url: ${{ vars.SOL_BASE_URL }}
          # Named when the dependencies job passed them on; when it installed nothing or failed, the review reads
          # without them.
          dependencies: ${{ needs.dependencies.outputs.passed == 'true' && 'rev-engine-dependencies' || '' }}
          dependencies-head: ${{ needs.who.outputs.head }}
          consumers: ${{ vars.REVIEW_CONSUMERS }}

      # A review that stops partway otherwise shows only in the Actions tab.
      - name: Say that the review stopped
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.pr-number || github.event.pull_request.number || github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The marker tells this workflow's own posts from others' when a later review reads the thread.
          gh pr comment "$NUMBER" --repo "$REPO" --body "The review run stopped before it finished, so its review may be missing or incomplete. The run's log says why: $RUN"$'\n\n<!-- rev-engine-prime -->'
