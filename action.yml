name: Rev Engine Prime review
description: Reviews a pull request with a model when a maintainer asks, and posts the findings as one review.

inputs:
  openrouter-api-key:
    description: OpenRouter API key. Pass it from a repository secret. Needed unless model-api-key is set, and not passed to the review when model-base-url is set.
    default: ""
  model-base-url:
    description: Where model requests go, when not OpenRouter, as RB_MODEL_BASE_URL in docs/SETTINGS.md. The review container then shares the runner's network, so it reaches the endpoint the way the runner does.
    default: ""
  model-api:
    description: The API the endpoint at model-base-url speaks, chat or anthropic, as RB_MODEL_API in docs/SETTINGS.md.
    default: ""
  model-api-key:
    description: The key for the endpoint at model-base-url, which gets no other key. Pass it from a repository secret. The shape doesn't start without it, on OpenRouter too, since it also reaches Sol at sol-base-url, and seals the run the shape saves and what a stopped review keeps in GitHub's cache.
    default: ""
  github-token:
    description: Token used to read the pull request and post the review.
    default: ${{ github.token }}
  pr-number:
    description: Pull request to review. Leave empty when the workflow is started by a comment on a pull request.
    default: ""
  command:
    description: A comment starts a review only when it is this text, or this text followed by a space.
    default: /review
  off-label:
    description: A pull request carrying this label isn't reviewed unless someone comments the command. Put on while a review runs, it keeps that review from posting, and a stopped one from saying so, unless a comment asked for it. Its results are still saved. Empty for none.
    default: no-automated-review
  model:
    description: Model that reviews and verifies, as OpenRouter names it, or as the endpoint at model-base-url does.
    default: anthropic/claude-opus-5.5
  min-severity:
    description: The least severe findings that get a comment. One of high, medium or low. Less severe findings are listed in a collapsed section of the summary. For the shape, high is its blockers and medium adds its should-fix issues; it says which of the change's own issues get a comment, and the summary lists every one either way.
    default: medium
  max-findings:
    description: Cap on the number of findings that get a comment. Findings past the cap join the collapsed section. The shape lists the change's blockers and should-fix issues open in the summary whether they get a comment or not, its minor issues folded by file, and issues in existing code (there before the change) folded apart below them, as far as GitHub's size limit allows, counting what it leaves out, and as a last resort cuts the summary's tail, saying so.
    default: "10"
  fit:
    description: Set to "on" to also say whether the change belongs in the project, judged by the goals and design the project states.
    default: "on"
  time-budget:
    description: Seconds allowed for the review. The shape doesn't use it.
    default: "780"
  allow-forks:
    description: Set to "true" to review pull requests from forks. Their code is only read, never run.
    default: "false"
  pipeline:
    description: Which review runs. "reader" is RevEngine's own reviewer. "shape" is the review shape in src/shape - a planner, a Sol battery and a haiku battery over every task of its plan, a grouper, a judge and a severity check - which takes as long as it needs, up to the job's limit, and needs sol-base-url.
    default: reader
  sol-base-url:
    description: For the shape, where Sol is asked, an OpenAI Responses endpoint, as RB_SOL_BASE_URL in docs/SETTINGS.md. It is reached with model-api-key.
    default: ""
  dependencies:
    description: For the shape, the name of an artifact of this workflow run that holds the head's installed dependencies, the contents of a node_modules directory, placed in the checkout's node_modules for the readers to read. Empty for none.
    default: ""
  dependencies-head:
    description: For the shape, the head commit the dependencies were installed from. They are placed only when the review reads that same head, so a push between the install and the review can't pair one revision with another's dependencies.
    default: ""
  consumers:
    description: For the shape, public repositories that rely on this one, as owner/name separated by spaces. Each is checked out at its default branch under .consumers/<owner>__<name> in the checkout, for the readers to read their use.
    default: ""
  authors:
    description: Which pull request events start a review. "writers" (the default) needs the person whose action raised the event, such as opening or reopening the pull request, to be able to push to the repository. "any" reviews whoever raised it, for a workflow that decides itself which pull requests to review, such as one started by pull_request_target. A comment or a manual run always needs a person with write access.
    default: writers

runs:
  using: composite
  steps:
    # Everything from the event is passed through the environment and never
    # written into a script, because comment text is untrusted.
    - name: Check who asked
      id: ask
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        ACTOR: ${{ github.event.comment.user.login || github.actor }}
        COMMENT: ${{ github.event.comment.body }}
        COMMENT_ON_PR: ${{ github.event.issue.pull_request.url }}
        EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        INPUT_NUMBER: ${{ inputs.pr-number }}
        COMMAND: ${{ inputs.command }}
        ALLOW_FORKS: ${{ inputs.allow-forks }}
        AUTHORS: ${{ inputs.authors }}
        PIPELINE: ${{ inputs.pipeline }}
        OFF_LABEL: ${{ inputs.off-label }}
        MODEL_API_KEY: ${{ inputs.model-api-key }}
      run: |
        set -euo pipefail
        skip() { echo "::notice::No review: $1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }

        number="${INPUT_NUMBER:-$EVENT_NUMBER}"
        if [ "$EVENT_NAME" = issue_comment ]; then
          [ -n "$COMMENT_ON_PR" ] || skip "the comment is not on a pull request"
          case "$COMMENT" in "$COMMAND"|"$COMMAND "*) ;; *) skip "the comment is not $COMMAND" ;; esac
          number="$EVENT_NUMBER"
        fi
        case "$number" in ''|*[!0-9]*) echo "::error::No pull request number. Set pr-number."; exit 1 ;; esac

        # Only people who can push to the repository may start a review, because each one costs money.
        # A pull request event with authors set to "any" was chosen by the workflow, which gates it itself.
        case "$AUTHORS" in writers|any) ;; *) echo "::error::authors must be writers or any."; exit 1 ;; esac
        case "$EVENT_NAME:$AUTHORS" in
          pull_request:any|pull_request_target:any) ;;
          *)
            permission=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
            case "$permission" in admin|write) ;; *) skip "$ACTOR does not have write access to $REPO" ;; esac
            ;;
        esac

        mkdir -p "$RUNNER_TEMP/rev-engine-prime/pr" "$RUNNER_TEMP/rev-engine-prime/out"
        gh api "repos/$REPO/pulls/$number" > "$RUNNER_TEMP/rev-engine-prime/pull.json"
        jq '{title, body}' "$RUNNER_TEMP/rev-engine-prime/pull.json" > "$RUNNER_TEMP/rev-engine-prime/pr/pr.json"
        if [ "$(jq -r '.head.repo.full_name // ""' "$RUNNER_TEMP/rev-engine-prime/pull.json")" != "$REPO" ] && [ "$ALLOW_FORKS" != true ]; then
          skip "pull request $number comes from a fork and allow-forks is not set"
        fi
        # A label turns the review off for one pull request; a comment asking for one still has it.
        if [ "$EVENT_NAME" != issue_comment ] && [ -n "$OFF_LABEL" ] && jq -e --arg label "$OFF_LABEL" 'any(.labels[]?; .name == $label)' "$RUNNER_TEMP/rev-engine-prime/pull.json" >/dev/null; then
          skip "pull request $number carries the label $OFF_LABEL; comment $COMMAND on it to review it"
        fi
        base=$(jq -r .base.sha "$RUNNER_TEMP/rev-engine-prime/pull.json")
        head=$(jq -r .head.sha "$RUNNER_TEMP/rev-engine-prime/pull.json")
        [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pull request $number has no base or head commit in its answer"; exit 1; }
        # A dispatched run of the shape (by hand, or a scheduled resume that dispatches) goes on with a stopped review;
        # at a head whose review is done it would be a fresh full review instead, which a /review comment asks for. A
        # summary's own marker, the whole of its last line but one, names its head.
        if [ "$PIPELINE" = shape ] && [ "$EVENT_NAME" = workflow_dispatch ]; then
          # Read whole first, so a failed lookup fails the run and grep's early exit can't fail the pipe.
          summaries=$(gh api --paginate "repos/$REPO/pulls/$number/reviews" --jq '.[] | select(.user.login == "github-actions[bot]") | [.body | split("\n")[] | select(length > 0)] | .[-2] // ""')
          if grep -qxE "<!-- rev-engine-shape-review [A-Za-z0-9._-]+-[0-9]+ $head -->" <<<"$summaries"; then
            skip "a review of $head is done; comment $COMMAND on the pull request to review it again"
          fi
        fi
        # The shape saves what it doesn't post (security issues in code the base already has, every reader's answers)
        # only sealed with the model key, so a review without one doesn't start: unsaved, its held issues would reach no one.
        if [ "$PIPELINE" = shape ]; then
          [ -n "$MODEL_API_KEY" ] || { echo "::error::The review shape needs model-api-key, which also seals what it saves, so no review runs"; exit 1; }
        fi
        { echo "run=true"; echo "number=$number"; echo "base=$base"; echo "head=$head"; } >> "$GITHUB_OUTPUT"

    # The token is not kept in the checkout, because the model can read files there.
    # actions/checkout refuses a fork's code under pull_request_target unless told it may: the
    # danger it guards against is running that code with the base repository's token and secrets.
    # Nothing here runs it. git only fetches and diffs the tree, the review image is built from this
    # action's own files, and the review container mounts the checkout read-only and only reads it.
    # So a fork's pull request is checked out exactly when allow-forks says forks are reviewed.
    - name: Check out the pull request
      if: steps.ask.outputs.run == 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.ask.outputs.head }}
        fetch-depth: 0
        path: rev-engine-prime-checkout
        persist-credentials: false
        token: ${{ inputs.github-token }}
        allow-unsafe-pr-checkout: ${{ inputs.allow-forks == 'true' }}

    - name: Write the diff
      if: steps.ask.outputs.run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BASE: ${{ steps.ask.outputs.base }}
        HEAD: ${{ steps.ask.outputs.head }}
      run: |
        set -euo pipefail
        repo="$GITHUB_WORKSPACE/rev-engine-prime-checkout"
        auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
        git -C "$repo" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --quiet --no-tags origin "$BASE"
        # Paths as themselves, so a name outside ASCII is the same in the diff as in the checkout.
        git -C "$repo" -c core.quotePath=false diff "$BASE...$HEAD" > "$RUNNER_TEMP/rev-engine-prime/pr/diff.patch"

    # A later review by the shape reads from the head its last review read, when that head is an ancestor of this
    # one, so it reads only what changed since; otherwise it reads the whole pull request. Each of its summaries
    # names its label and head, and its round counts on from the last.
    - name: Find the review's round
      id: round
      if: steps.ask.outputs.run == 'true' && inputs.pipeline == 'shape'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        NUMBER: ${{ steps.ask.outputs.number }}
        BASE: ${{ steps.ask.outputs.base }}
        HEAD: ${{ steps.ask.outputs.head }}
      run: |
        set -euo pipefail
        repo="$GITHUB_WORKSPACE/rev-engine-prime-checkout"
        # A failed lookup fails the run, rather than starting the round count again at 1. A summary's own marker is
        # the whole of its last line but one, so only such a line is read: one quoted elsewhere, as by the other review,
        # or inside a line of model text, isn't.
        gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" --jq '.[] | select(.user.login == "github-actions[bot]") | [.body | split("\n")[] | select(length > 0)] | .[-2] // ""' > "$RUNNER_TEMP/rev-engine-prime/reviews.txt"
        last=$(grep -xE '<!-- rev-engine-shape-review [A-Za-z0-9._-]+-[0-9]+ [0-9a-f]{40} -->' "$RUNNER_TEMP/rev-engine-prime/reviews.txt" | tail -n 1 || true)
        round=1; round_of=""; base="$BASE"
        if [ -n "$last" ]; then
          label=$(awk '{print $3}' <<<"$last"); reviewed=$(awk '{print $4}' <<<"$last")
          round=$(( 10#${label##*-} + 1 ))
          if [ "$reviewed" != "$HEAD" ] && git -C "$repo" merge-base --is-ancestor "$reviewed" "$HEAD" 2>/dev/null; then
            round_of="$label"; base="$reviewed"
            git -C "$repo" -c core.quotePath=false diff "$reviewed" "$HEAD" > "$RUNNER_TEMP/rev-engine-prime/pr/diff.patch"
          fi
        fi
        echo "::notice::Review round $round${round_of:+, reading from the head of $round_of, $base}"
        { echo "round=$round"; echo "round-of=$round_of"; echo "base=$base"; } >> "$GITHUB_OUTPUT"

    # Installed by a job of its own, with no secrets, so a fork's package configuration never runs beside them.
    # What the pull request has at node_modules or .consumers, a link included, goes before anything is placed there:
    # a link would carry the download or the clones out of the checkout, and either would pass for what the review
    # installed or checked out.
    - name: Clear the places the review fills
      if: steps.ask.outputs.run == 'true' && inputs.pipeline == 'shape'
      shell: bash
      run: rm -rf "$GITHUB_WORKSPACE/rev-engine-prime-checkout/node_modules" "$GITHUB_WORKSPACE/rev-engine-prime-checkout/.consumers"

    - name: Place the installed dependencies
      if: steps.ask.outputs.run == 'true' && inputs.pipeline == 'shape' && inputs.dependencies != '' && inputs.dependencies-head == steps.ask.outputs.head
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.dependencies }}
        # The artifact holds node_modules' contents, since an upload of one directory is rooted inside it.
        path: rev-engine-prime-checkout/node_modules

    - name: Say why the dependencies aren't placed
      if: steps.ask.outputs.run == 'true' && inputs.pipeline == 'shape' && inputs.dependencies != '' && inputs.dependencies-head != steps.ask.outputs.head
      shell: bash
      env:
        DEPENDENCIES_HEAD: ${{ inputs.dependencies-head }}
      run: |
        if [ -z "$DEPENDENCIES_HEAD" ]; then echo "::notice::No dependencies-head was given, so the dependencies aren't placed and the review reads without them"
        else echo "::notice::The head under review isn't dependencies-head, the head the dependencies were installed from (the pull request may have moved since), so the review reads without them"; fi

    - name: Check out the consumers
      if: steps.ask.outputs.run == 'true' && inputs.pipeline == 'shape' && inputs.consumers != ''
      # A consumer that can't be cloned, or isn't named as owner/name, is said and left out; the others are still read.
      continue-on-error: true
      shell: bash
      env:
        CONSUMERS: ${{ inputs.consumers }}
      run: |
        set -euo pipefail
        dir="$GITHUB_WORKSPACE/rev-engine-prime-checkout/.consumers"
        mkdir "$dir"
        for nwo in $CONSUMERS; do
          [[ "$nwo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$nwo" != */.* && "$nwo" != .* ]] || { echo "::warning::consumers: \"$nwo\" is not owner/name, so it isn't read"; continue; }
          dest="$dir/${nwo%%/*}__${nwo#*/}"
          # A consumer named twice is read once; its first clone is never touched by the second's failure.
          if [ -e "$dest" ]; then echo "::notice::consumers: $nwo is named more than once, and is read once"; continue; fi
          # Nothing a failed clone leaves behind is read as the consumer.
          git clone --quiet --depth 1 "https://github.com/$nwo.git" "$dest" || { rm -rf "$dest"; echo "::warning::consumers: $nwo couldn't be cloned (a misspelt name, or a repository this job can't read), so the review reads without it"; }
        done

    # A review that stopped for any reason but a refusal, in a run GitHub let write the cache, kept its plan and answers
    # here; the same pull request read from the same base to the same head goes on from them. The review takes them only
    # if they are its own round's.
    - name: Restore a stopped review's answers
      id: kept
      if: steps.ask.outputs.run == 'true' && inputs.pipeline == 'shape'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/rev-engine-prime/kept
        key: rev-engine-shape-${{ steps.ask.outputs.number }}-${{ steps.ask.outputs.head }}-${{ steps.round.outputs.base }}
        restore-keys: rev-engine-shape-${{ steps.ask.outputs.number }}-${{ steps.ask.outputs.head }}-${{ steps.round.outputs.base }}-

    # What a stopped review kept is sealed with the model key, since a pull request's own workflow can restore the
    # default branch's cache. Anything else restored, or a seal this key doesn't open, is set aside, and the review
    # reads from the start.
    - name: Open a stopped review's answers
      if: steps.ask.outputs.run == 'true' && inputs.pipeline == 'shape'
      shell: bash
      env:
        KEPT_KEY: ${{ inputs.model-api-key }}
      run: |
        set -euo pipefail
        kept="$RUNNER_TEMP/rev-engine-prime/kept"; sealed="$RUNNER_TEMP/rev-engine-prime/kept.tar.enc"
        [ -d "$kept" ] || exit 0
        rm -f "$sealed"
        if [ -f "$kept/kept.tar.enc" ] && [ ! -L "$kept/kept.tar.enc" ]; then mv "$kept/kept.tar.enc" "$sealed"; fi
        rm -rf "$kept"
        [ -f "$sealed" ] || { echo "::notice::What was restored for this review isn't sealed, so it's set aside and the review reads from the start"; exit 0; }
        # The key without the whitespace round it, as action/seal.sh sealed with it.
        KEPT_KEY="${KEPT_KEY#"${KEPT_KEY%%[![:space:]]*}"}"; export KEPT_KEY="${KEPT_KEY%"${KEPT_KEY##*[![:space:]]}"}"
        mkdir "$kept"
        if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -pass env:KEPT_KEY -in "$sealed" | tar -C "$kept" -xf - --no-same-owner --no-same-permissions; then
          rm -rf "$kept"
          echo "::warning::What a stopped review kept doesn't open with this repository's model key, so the review reads from the start"
        fi
        rm -f "$sealed"

    - name: Build the reviewer
      if: steps.ask.outputs.run == 'true'
      shell: bash
      run: docker build --quiet --tag rev-engine-prime:action "$GITHUB_ACTION_PATH"

    # The maintainer's decisions on earlier reviews of this pull request, so the review does not
    # report decided findings again, and for the shape what others said on the thread and the
    # repository's open issues, so its judge links an issue raised already. It holds the GitHub
    # token and no model key. A failure is logged as a warning and leaves no file, and the review
    # then runs without earlier decisions, or the shape without the thread and issues, saying so.
    - name: Collect earlier decisions
      if: steps.ask.outputs.run == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
        RB_NWO: ${{ github.repository }}
        RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
        KNOWN_PATH: ${{ inputs.pipeline == 'shape' && '/work/pr/known.json' || '' }}
      run: |
        docker run --rm --entrypoint node \
          -v "$GITHUB_ACTION_PATH/action:/agent/action:ro" \
          -v "$RUNNER_TEMP/rev-engine-prime/pr:/work/pr" \
          -e GITHUB_TOKEN -e GITHUB_API_URL -e GITHUB_GRAPHQL_URL -e RB_NWO -e RB_PR_NUMBER -e PRIOR_PATH=/work/pr/prior.json -e DECISIONS_PATH=/work/pr/decisions.jsonl -e KNOWN_PATH \
          rev-engine-prime:action /agent/action/collect.ts \
          || echo "::warning::Earlier decisions not collected: the collector exited with an error"

    - name: Review
      id: review
      if: steps.ask.outputs.run == 'true'
      shell: bash
      env:
        # An endpoint of your own gets model-api-key alone, never the OpenRouter key.
        OPENROUTER_API_KEY: ${{ inputs.model-base-url == '' && inputs.openrouter-api-key || '' }}
        RB_MODEL_BASE_URL: ${{ inputs.model-base-url }}
        RB_MODEL_API: ${{ inputs.model-api }}
        RB_MODEL_API_KEY: ${{ inputs.model-api-key }}
        RB_NWO: ${{ github.repository }}
        RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
        RB_BASE: ${{ steps.round.outputs.base || steps.ask.outputs.base }}
        RB_HEAD: ${{ steps.ask.outputs.head }}
        RB_CONFIG_MODEL: ${{ inputs.model }}
        SHAPE: ${{ inputs.pipeline == 'shape' && 'on' || '' }}
        RB_SOL_BASE_URL: ${{ inputs.sol-base-url }}
        RB_SHAPE_ROUND: ${{ steps.round.outputs.round }}
        RB_SHAPE_ROUND_OF: ${{ steps.round.outputs.round-of }}
        # Project rules are read from the pull request's base, never from an earlier head of the pull request itself.
        RB_SHAPE_RULES_BASE: ${{ steps.ask.outputs.base }}
        KEPT: ${{ steps.kept.outputs.cache-matched-key }}
        RB_CONFIG_TIME_BUDGET: ${{ inputs.time-budget }}
        RB_CONFIG_FIT: ${{ inputs.fit == 'on' && inputs.model || '' }}
      run: |
        set -euo pipefail
        # An endpoint of your own is reached the way the runner reaches it, such as over a VPN the job joined.
        network=()
        if [ -n "$RB_MODEL_BASE_URL" ]; then network=(--network host); fi
        # The review shape: its settings, background-class model calls, and a stopped review's answers when restored.
        shape=()
        if [ -n "$SHAPE" ]; then
          export RB_MODEL_HEADERS
          RB_MODEL_HEADERS=$(jq -cn --arg tag "rev-engine/$RB_NWO#$RB_PR_NUMBER" '{"x-orca-class": "batch", "x-caller-tag": $tag}')
          shape=(-e RB_CONFIG_SHAPE=on -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e RB_SOL_BASE_URL -e RB_SHAPE_ROUND -e RB_SHAPE_ROUND_OF -e RB_SHAPE_RULES_BASE -e RB_MODEL_HEADERS -e RB_SHAPE_OUT=/work/out/shape)
          if [ -n "$KEPT" ]; then shape+=(-v "$RUNNER_TEMP/rev-engine-prime/kept:/work/kept:ro" -e RB_SHAPE_KEPT=/work/kept -e RB_SHAPE_RESUMED_FROM="$KEPT"); fi
        fi
        status=0
        docker run --rm "${network[@]}" "${shape[@]}" \
          -v "$GITHUB_WORKSPACE/rev-engine-prime-checkout:/work/repo:ro" \
          -v "$RUNNER_TEMP/rev-engine-prime/pr:/work/pr:ro" \
          -v "$RUNNER_TEMP/rev-engine-prime/out:/work/out" \
          -e OPENROUTER_API_KEY -e RB_MODEL_BASE_URL -e RB_MODEL_API -e RB_MODEL_API_KEY -e RB_NWO -e RB_PR_NUMBER -e RB_BASE -e RB_HEAD \
          -e RB_CONFIG_MODEL -e RB_CONFIG_TIME_BUDGET -e RB_CONFIG_FIT -e RB_DETAILS_OUT=/work/out/details.json \
          -e RB_REPO=/work/repo -e RB_DIFF=/work/pr/diff.patch -e RB_PR_JSON=/work/pr/pr.json -e RB_PRIOR_JSON=/work/pr/prior.json \
          -e RB_OUT=/work/out/findings.json -e RB_ATTEMPT=1 \
          rev-engine-prime:action || status=$?
        # Exit 3 is the review shape stopping with its answers kept: Sol couldn't take its calls, a call was
        # refused, or the job's time ran out. The steps below say so on the pull request.
        echo "status=$status" >> "$GITHUB_OUTPUT"
        if [ "$status" = 3 ]; then
          # Read on lines of their own, so a stopped.json that can't be read fails the step rather than leave the stop
          # empty, which would keep a refused review's answers.
          stop=$(jq -er .reason "$RUNNER_TEMP/rev-engine-prime/out/stopped.json")
          category=$(jq -r '.category // ""' "$RUNNER_TEMP/rev-engine-prime/out/stopped.json")
          { echo "stop=$stop"; echo "category=$category"; } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        exit "$status"

    # Every stop but a refusal keeps the answers where GitHub lets the run write its cache, so a later run of the same
    # pull request at the same head goes on from them, whether a maintainer's /review starts it or a scheduled resume of
    # one stopped for Sol or the time limit. GitHub lets a run started by pull_request_target or a comment restore the
    # default branch's cache but not write it (its cache access for low-trust triggers), so the Action keeps answers
    # only from a manual run: a stop of any other run keeps nothing new, and its first resume, a manual run, goes on
    # from what an earlier run kept, if any. So the event decides: the runner gives the access it grants
    # (ACTIONS_CACHE_MODE) to JavaScript and container actions alone (actions/runner, NodeScriptActionHandler.cs and
    # ContainerActionHandler.cs), never to a run step like this one.
    # The cache's version comes from its paths, so the answers are saved from the path they're
    # restored to. A run that stopped before it wrote its plan has nothing newer than what it restored, which stays in
    # the cache as it was, so nothing is saved.
    - name: Gather a stopped review's answers
      id: gather
      if: steps.review.outputs.status == '3' && steps.review.outputs.stop != 'refused'
      shell: bash
      env:
        SEAL_KEY: ${{ inputs.model-api-key }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/rev-engine-prime/out/shape"; kept="$RUNNER_TEMP/rev-engine-prime/kept"
        [ -f "$out/shape-plan.json" ] || exit 0
        [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || { echo "readonly=true" >> "$GITHUB_OUTPUT"; exit 0; }
        # Sealed with the model key (action/seal.sh), as "Open a stopped review's answers" opens it, and the seal alone
        # is kept.
        rm -rf "$kept"
        bash "$GITHUB_ACTION_PATH/action/seal.sh" "$out" "$kept/kept.tar.enc"
        echo "kept=true" >> "$GITHUB_OUTPUT"

    - name: Keep a stopped review's answers
      if: steps.gather.outputs.kept == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/rev-engine-prime/kept
        key: rev-engine-shape-${{ steps.ask.outputs.number }}-${{ steps.ask.outputs.head }}-${{ steps.round.outputs.base }}-${{ github.run_id }}-${{ github.run_attempt }}

    # The shape's run directories, for a record of the reviews, kept whether the review finished or stopped. They hold
    # what the review doesn't post, so they're saved sealed (action/seal.sh) before the review is posted: a save that
    # fails then fails the job with the review unposted, and no summary marks it done, so a later run of it isn't turned
    # away. A stopped review's notice still says it stopped.
    - name: Seal the review shape's run
      id: seal
      if: steps.ask.outputs.run == 'true' && inputs.pipeline == 'shape' && !cancelled()
      shell: bash
      env:
        SEAL_KEY: ${{ inputs.model-api-key }}
      run: |
        set -euo pipefail
        sealed="$RUNNER_TEMP/rev-engine-prime/sealed/shape.tar.enc"
        bash "$GITHUB_ACTION_PATH/action/seal.sh" "$RUNNER_TEMP/rev-engine-prime/out/shape" "$sealed"
        if [ -f "$sealed" ]; then echo "sealed=true" >> "$GITHUB_OUTPUT"; fi

    # Named for its attempt too, so a re-run attempt of a round that posted nothing, which has the same round, saves
    # beside an earlier attempt's run rather than over it.
    - name: Save the review shape's run
      if: steps.seal.outputs.sealed == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: rev-engine-shape-${{ steps.ask.outputs.number }}-${{ steps.round.outputs.round }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rev-engine-prime/sealed
        if-no-files-found: error

    # A refusal is named by its category alone, never by what the provider said.
    - name: Say that the review stopped
      if: ${{ !cancelled() && steps.review.outputs.status == '3' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        NUMBER: ${{ steps.ask.outputs.number }}
        STOP: ${{ steps.review.outputs.stop }}
        CATEGORY: ${{ steps.review.outputs.category }}
        KEPT: ${{ steps.gather.outputs.kept }}
        READONLY: ${{ steps.gather.outputs.readonly }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EVENT_NAME: ${{ github.event_name }}
        OFF_LABEL: ${{ inputs.off-label }}
        COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        # The off label, put on while the review ran, keeps this notice off the thread too, as "Post the review" keeps
        # the review; read whole first, so a failed lookup fails the step rather than posting past the label.
        if [ "$EVENT_NAME" != issue_comment ] && [ -n "$OFF_LABEL" ]; then
          labels=$(gh api --paginate "repos/$REPO/issues/$NUMBER/labels" --jq '.[].name')
          if grep -qxF -- "$OFF_LABEL" <<<"$labels"; then
            echo "::notice::Not posted: pull request $NUMBER now carries the label $OFF_LABEL, so its review stopping isn't said there. A comment of $COMMAND reviews it again."
            exit 0
          fi
        fi
        # What it read is kept in GitHub's cache, which drops an entry unused for a week, or sooner when the
        # repository's cache is full. actions/cache's save warns and succeeds when the cache refuses it, so the notice
        # can say only that the run asked the cache to keep it, and the run's log says if it refused.
        # Only a stop that gathered answers to keep says so; one with nothing to keep (no plan written, none restored) doesn't.
        kept="A later run of this head from the same base, which a $COMMAND comment from someone with write access starts, goes on from what an earlier run of it kept, if any, or reads it from the start."
        if [ "${READONLY:-}" = true ]; then kept="This run kept nothing for a later run to go on from: only a manual run keeps a stopped review's answers. A later run of this head from the same base, which a $COMMAND comment from someone with write access starts, goes on from what an earlier run of it kept, if any, or reads it from the start."; fi
        if [ "${KEPT:-}" = true ]; then kept="It asked GitHub's cache to keep what it has read (the run's log says if the cache refused), for a later run of this head from the same base, which a $COMMAND comment from someone with write access starts, for as long as the cache holds it (up to a week unused)."; fi
        # GitHub's cache serves a run only what its own branch or the default branch saved, so what a manual run on
        # another branch kept is that branch's.
        if [ "${KEPT:-}" = true ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then kept="It asked GitHub's cache to keep what it has read (the run's log says if the cache refused), for as long as the cache holds it (up to a week unused), for a later manual run of this head on ${GITHUB_REF#refs/heads/}; a $COMMAND comment runs on the default branch, where what this run kept isn't, and goes on from what a run there kept, if any, or reads it from the start."; fi
        case "$STOP" in
          sol-unavailable) body="This review stopped before it finished, because Sol, one of its two readers, couldn't take its calls. $kept" ;;
          time) body="This review stopped at its own time limit, set inside the job's, before it finished. $kept" ;;
          refused) body="This review stopped: the model provider refused one of its calls (category: $CATEGORY). It won't go on by itself, and a $COMMAND comment may meet the same refusal." ;;
          *) body="This review stopped before it finished, and won't go on by itself. $kept" ;;
        esac
        # The marker tells this Action's own posts from others' when a later review reads the thread.
        gh pr comment "$NUMBER" --repo "$REPO" --body "$body The run: $RUN"$'\n\n<!-- rev-engine-prime -->'

    # Keep the reader's findings with their severities and kinds, so a review can later be turned into an eval case
    # with evals/add.ts. The reader holds nothing back on purpose, so they're saved as they are. The shape saves only its
    # sealed run, above, since its findings file holds what a review the off label kept from posting never posted.
    - name: Save the review
      if: steps.ask.outputs.run == 'true' && inputs.pipeline != 'shape' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: rev-engine-prime-pr-${{ steps.ask.outputs.number }}
        path: ${{ runner.temp }}/rev-engine-prime/out/*.json
        if-no-files-found: ignore

    # The posting script runs in the same image so the runner needs no Node of its own.
    # It gets the GitHub token and no model key; the review above gets the model key and no GitHub token.
    - name: Post the review
      id: post
      if: steps.ask.outputs.run == 'true' && steps.review.outputs.status != '3'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        RB_NWO: ${{ github.repository }}
        RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
        RB_HEAD: ${{ steps.ask.outputs.head }}
        SHAPE: ${{ inputs.pipeline == 'shape' && 'on' || '' }}
        REVIEW_MODEL: ${{ inputs.model }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        MAX_COMMENTS: ${{ inputs.max-findings }}
        EVENT_NAME: ${{ github.event_name }}
        OFF_LABEL: ${{ inputs.off-label }}
        COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        # The off label, put on while the review ran, keeps a review nobody asked for by comment from posting. Read
        # whole first, so a failed lookup fails the step rather than posting past the label.
        if [ "$EVENT_NAME" != issue_comment ] && [ -n "$OFF_LABEL" ]; then
          labels=$(GH_TOKEN="$GITHUB_TOKEN" gh api --paginate "repos/$RB_NWO/issues/$RB_PR_NUMBER/labels" --jq '.[].name')
          if grep -qxF -- "$OFF_LABEL" <<<"$labels"; then
            echo "::notice::Not posted: pull request $RB_PR_NUMBER now carries the label $OFF_LABEL. The review's results are saved with this run, and a comment of $COMMAND reviews it again and posts."
            exit 0
          fi
        fi
        # The shape's review is posted from its own result, and each area's run directory gets the comment ids.
        shape=()
        if [ -n "$SHAPE" ]; then shape=(-v "$RUNNER_TEMP/rev-engine-prime/out/shape:/work/out/shape" -e SHAPE_PATH=/work/out/shape/shape-review.json -e SHAPE_OUT=/work/out/shape); fi
        docker run --rm --entrypoint node "${shape[@]}" \
          -v "$GITHUB_ACTION_PATH/action:/agent/action:ro" \
          -v "$RUNNER_TEMP/rev-engine-prime:/work:ro" \
          -e GITHUB_TOKEN -e GITHUB_API_URL -e GITHUB_GRAPHQL_URL -e GITHUB_SERVER_URL -e RB_NWO -e RB_PR_NUMBER -e RB_HEAD -e REVIEW_MODEL -e MIN_SEVERITY -e MAX_COMMENTS \
          -e FINDINGS_PATH=/work/out/details.json -e FIT_PATH=/work/out/fit.json -e DIFF_PATH=/work/pr/diff.patch \
          rev-engine-prime:action /agent/action/post.ts

    # The run again, now that posting has written the ids of its comments into it (posted.json, the first 100 as
    # post.ts lists them), whether the post finished or failed partway. It's saved beside the first under a name of its
    # own: with overwrite, upload-artifact deletes an artifact of the same name before it uploads (actions/upload-artifact
    # v4, src/upload/upload-artifact.ts), so a failed upload would leave the run with none, and without it an upload under
    # a taken name fails (its README). Each attempt's two have names of their own, so whoever collects a round takes its
    # latest attempt's, the -posted copy over the first.
    - name: Seal it again with its comments
      id: reseal
      if: steps.seal.outputs.sealed == 'true' && !cancelled() && (steps.post.outcome == 'success' || steps.post.outcome == 'failure')
      shell: bash
      env:
        SEAL_KEY: ${{ inputs.model-api-key }}
      run: |
        set -euo pipefail
        sealed="$RUNNER_TEMP/rev-engine-prime/sealed/shape.tar.enc"
        bash "$GITHUB_ACTION_PATH/action/seal.sh" "$RUNNER_TEMP/rev-engine-prime/out/shape" "$sealed"
        if [ -f "$sealed" ]; then echo "sealed=true" >> "$GITHUB_OUTPUT"; fi

    - name: Save it again with its comments
      if: steps.reseal.outputs.sealed == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: rev-engine-shape-${{ steps.ask.outputs.number }}-${{ steps.round.outputs.round }}-${{ github.run_attempt }}-posted
        path: ${{ runner.temp }}/rev-engine-prime/sealed
        if-no-files-found: error
